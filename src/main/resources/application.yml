spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parcella}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
parcella:
  jwt:
    secret: ${JWT_SECRET}     # no default: a missing secret must stop the app
    access-token-ttl: 60m
  cors:
    frontend-url: ${FRONTEND_URL}
  upload:
    dir: ${UPLOAD_DIR}